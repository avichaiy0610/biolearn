# Build check for every push/PR to main.
#
# Production deploys are done by Vercel's Git integration (vercel[bot]), not by
# this workflow. The previous "Deploy to Vercel" workflow failed at
# `vercel pull` because no VERCEL_TOKEN secret existed; it also could not have
# produced a correct prebuilt deploy, because all of the project's env vars are
# "sensitive" in Vercel and `vercel pull` only returns placeholders outside
# Vercel's own build infrastructure. The app builds without any secrets (DB
# reads at build time fall back gracefully), so CI needs none.
name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
